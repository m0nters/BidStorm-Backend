input {
  beats {
    port => 5044
  }
}

filter {
  # Parse JSON logs
  json {
    source => "message"
    target => "log"
  }

  # Extract timestamp from log
  if [log][@timestamp] {
    date {
      match => ["[log][@timestamp]", "ISO8601"]
      target => "@timestamp"
    }
  }

  # Add application metadata
  mutate {
    add_field => {
      "application" => "online-auction"
      "environment" => "development"
    }
  }

  # Parse log level
  if [log][level] {
    mutate {
      add_field => { "log_level" => "%{[log][level]}" }
    }
  }

  # Parse logger name
  if [log][logger_name] {
    mutate {
      add_field => { "logger" => "%{[log][logger_name]}" }
    }
  }

  # Parse thread name
  if [log][thread_name] {
    mutate {
      add_field => { "thread" => "%{[log][thread_name]}" }
    }
  }

  # Parse message
  if [log][message] {
    mutate {
      add_field => { "log_message" => "%{[log][message]}" }
    }
  }

  # Handle stack traces
  if [log][stack_trace] {
    mutate {
      add_field => { "stack_trace" => "%{[log][stack_trace]}" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "logstash-online-auction-%{+YYYY.MM.dd}"
    codec => json
  }

  # Uncomment for debugging
  # stdout {
  #   codec => rubydebug
  # }
}
